x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
  storage-init:
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    logging: *default-logging
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - storage_data:/data
    networks: [data]
  model-init:
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    logging: *default-logging
    command: ["sh", "-c", "mkdir -p /models && chown -R 10001:10001 /models"]
    volumes:
      - model_data:/models
    networks: [data]
  migrate:
    image: elec_man-backend:latest
    build:
      context: ./backend
    logging: *default-logging
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
  backend:
    image: elec_man-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-Hệ thống AI quản lý đồng hồ điện}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/electric-meter-ai}
      MODELS_ROOT: ${MODELS_ROOT:-/models}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ema_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - storage_data:${STORAGE_ROOT:-/data/electric-meter-ai}
      - model_data:${MODELS_ROOT:-/models}:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      application:
        aliases: [backend]
      data:
  worker:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/electric-meter-ai}
      MODELS_ROOT: ${MODELS_ROOT:-/models}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - storage_data:${STORAGE_ROOT:-/data/electric-meter-ai}
      - model_data:${MODELS_ROOT:-/models}:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [data]
  trainer:
    build:
      context: .
      dockerfile: ai/Dockerfile
    command: ["python", "-m", "ai.trainer"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/electric-meter-ai}
      MODELS_ROOT: ${MODELS_ROOT:-/models}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - storage_data:${STORAGE_ROOT:-/data/electric-meter-ai}:ro
      - model_data:${MODELS_ROOT:-/models}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [data]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      edge:
        aliases: [frontend]
  nginx:
    image: nginx:stable-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [edge, application]
networks:
  edge:
    driver: bridge
  application:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
volumes:
  postgres_data:
  storage_data:
  model_data:
