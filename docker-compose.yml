services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  storage-init:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - storage_data:/data
    networks: [internal]
  migrate:
    image: elec_man-backend:latest
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  backend:
    image: elec_man-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-Electricity Meter AI Management System}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/electric-meter-ai}
      MODELS_ROOT: ${MODELS_ROOT:-/models}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ema_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    volumes:
      - storage_data:${STORAGE_ROOT:-/data/electric-meter-ai}
      - model_data:${MODELS_ROOT:-/models}:ro
      - app_logs:/var/log/electric-meter-ai
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]
  worker:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/electric-meter-ai}
      MODELS_ROOT: ${MODELS_ROOT:-/models}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    volumes:
      - storage_data:${STORAGE_ROOT:-/data/electric-meter-ai}
      - model_data:${MODELS_ROOT:-/models}:ro
      - app_logs:/var/log/electric-meter-ai
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [internal]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  storage_data:
  model_data:
  app_logs:
