name: Kiểm thử và build

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-repository-secrets.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build AI runtime base
        run: docker build --tag elec_man-ai-ci-base --file ai/Dockerfile .
      - name: Build AI test image
        run: docker build --tag elec_man-ai-ci-test --file ai/Dockerfile.test .
      - name: Run AI tests
        run: docker run --rm --env SESSION_SECRET=ci-only-session-secret-at-least-32-characters elec_man-ai-ci-test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          POSTGRES_DB: electric_meter_ai
          POSTGRES_USER: electric_meter_app
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql+psycopg://electric_meter_app:ci-only-password@postgres:5432/electric_meter_ai
          SESSION_SECRET: ci-only-session-secret-at-least-32-characters
        run: docker compose config --quiet
